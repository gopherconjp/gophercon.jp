language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!design/snapshot/**"
    - "!**/*.penpot"
    - "!public/font/**"
    - "!**/*.ttf"
    - "!**/*.otf"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!.github/skills/**"
    - "!.github/copilot-instructions.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"

  path_instructions:
    - path: "design/scripts/**"
      instructions: |
        Local-only, single-user tooling that drives a self-hosted Penpot Docker stack on `localhost`; never deployed or multi-user.
        Accept by design (do not report):
        - Fixed documented credentials (`creative@gophercon.jp` / `password`)
        - Password printed in local terminal output
        - Hardcoded config (no env overrides)
        - Plain HTTP to the local Penpot service
        - Minimal transport hardening (no https-only or asset-origin validation required)
    - path: "src/components/common/i18n/**"
      instructions: |
        Intentional locale behavior; accept by design (do not report):
        - `LocaleRedirector` auto-redirects by browser locale on every page, not only the root
        - Unsupported locales fall back to `defaultLocale` (keep the guard; never hardcode `ENGLISH`)
        - `LocaleSwitcher` persists the clicked locale so auto-redirect does not bounce the user back
    - path: "src/components/2027/_common/header/**"
      instructions: |
        Intentional design; accept by design (do not report):
        - Nav link labels are intentionally English for every locale; only destinations are localized via `getLocalizedUrl`
        - `NavLink` sets `tabindex={-1}` on the current-page link (`current`) to keep it out of the sequential tab order; `aria-current="page"` identifies the current page
