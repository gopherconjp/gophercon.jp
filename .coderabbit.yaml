language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  path_filters:
    - "!design/snapshot/**"
    - "!**/*.penpot"
    - "!public/font/**"
    - "!**/*.ttf"
    - "!**/*.otf"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!.github/skills/**"
    - "!.github/instructions/**"
    - "!.github/copilot-instructions.md"

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"

  path_instructions:
    - path: "design/scripts/**"
      instructions: |
        Local-only single-user tooling for self-hosted Penpot on `localhost`; never deployed.
        Accept by design (do not report): fixed documented credentials (`creative@gophercon.jp` / `password`), password in terminal output, hardcoded config, plain HTTP to localhost, minimal transport hardening.
    - path: "src/components/common/i18n/**"
      instructions: |
        Intentional locale behavior; accept by design (do not report): `LocaleRedirector` redirects on every page by browser locale; unsupported locales fall back to `defaultLocale` (keep guard, never hardcode `ENGLISH`); `LocaleSwitcher` persists clicked locale to avoid redirect bounce.
    - path: "src/components/2027/_common/header/**"
      instructions: |
        Intentional design; accept by design (do not report): nav labels stay English in all locales (only destinations localized via `getLocalizedUrl`); current `NavLink` uses `tabindex={-1}` + `aria-current="page"`.
    - path: "src/components/**/_styles/**"
      instructions: |
        Intentional design; accept by design (do not report): link colors reuse `--_color-sub` / `--_color-accent` tokens; do not flag white-background contrast.
    - path: "src/components/index/not-found/**"
      instructions: |
        Intentional design; accept by design (do not report): 404 builds to one static HTML (`assets.not_found_handling: 404-page` in `wrangler.json`) served for all missing paths, so per-locale split is impossible; single bilingual JA+EN page with fixed `locale="en"` and no Intlayer dictionary; do not request locale propagation or locale-specific lookup restoration.
    - path: "src/components/2027/contact/content/socials.ts"
      instructions: |
        Intentional; accept by design (do not report): Mastodon `handle` stays short `@gopherconjp`.
