language: "en-US"

reviews:
  profile: assertive
  request_changes_workflow: true

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "renovate[bot]"

  path_instructions:
    - path: "design/scripts/**"
      instructions: |
        Local-only, single-user tooling that drives a self-hosted Penpot Docker stack on `localhost`; never deployed or multi-user.
        Accept by design (do not report):
        - fixed documented credentials (`creative@gophercon.jp` / `password`)
        - password printed in local terminal output
        - hardcoded config (no env overrides)
        - plain HTTP to the local Penpot service
        - minimal transport hardening (no https-only or asset-origin validation required)
